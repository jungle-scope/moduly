name: Deploy to Lightsail/EC2

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'docker/**'
      - 'docker-compose.lightweight.yml'
  
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      service:
        description: 'Service to restart (all, gateway, worker, frontend, sandbox)'
        required: false
        default: 'all'

env:
  DEPLOY_USER: ubuntu  # Lightsail/EC2 사용자명
  DEPLOY_PATH: /home/ubuntu/moduly  # 배포 디렉토리

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    
    steps:
    # 1. 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. SSH Key 설정
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts
    
    # 3. GHCR 이미지 최신화 (서버에서 Pull)
    - name: Pull latest images on server
      run: |
        ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          
          echo "🔄 Pulling latest images from GHCR..."
          docker-compose -f docker/docker-compose.lightweight.yml pull
          
          echo "✅ Images pulled successfully"
        EOF
    
    # 4. 환경변수 업데이트 (옵션)
    - name: Update environment variables
      run: |
        ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          
          # .env 파일이 없으면 생성 (최초 배포 시)
          if [ ! -f .env ]; then
            echo "📝 Creating .env file..."
            cat > .env << 'ENVEOF'
SECRET_KEY=${{ secrets.SECRET_KEY }}
ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
MASTER_KEY=${{ secrets.MASTER_KEY }}
ENVEOF
          fi
        EOF
    
    # 5. Docker Compose 재시작
    - name: Restart services
      run: |
        ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          
          SERVICE="${{ github.event.inputs.service }}"
          
          if [ "$SERVICE" = "all" ] || [ -z "$SERVICE" ]; then
            echo "🔄 Restarting all services..."
            docker-compose -f docker/docker-compose.lightweight.yml down
            docker-compose -f docker/docker-compose.lightweight.yml up -d
          else
            echo "🔄 Restarting $SERVICE service..."
            docker-compose -f docker/docker-compose.lightweight.yml up -d --force-recreate $SERVICE
          fi
          
          echo "✅ Services restarted"
        EOF
    
    # 6. 헬스체크
    - name: Health check
      run: |
        ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          
          echo "⏳ Waiting for services to be healthy..."
          sleep 30
          
          # 컨테이너 상태 확인
          docker-compose -f docker/docker-compose.lightweight.yml ps
          
          # Gateway 헬스체크
          if curl -f http://localhost:80/api/v1/health > /dev/null 2>&1; then
            echo "✅ Gateway is healthy"
          else
            echo "❌ Gateway health check failed"
            exit 1
          fi
        EOF
    
    # 7. 배포 완료 알림
    - name: Deployment summary
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "📍 Server: ${{ secrets.LIGHTSAIL_HOST }}"
        echo "🔗 URL: http://${{ secrets.LIGHTSAIL_HOST }}"
